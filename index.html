<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>misa — Level Designer & 3D Artist</title>
    
    <!-- Сучасні шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        /* ── TOKENS & RESET ── */
        :root {
            --bg: #0d0e10;
            --text: #e8e7e4;
            --text-dim: rgba(232, 231, 228, 0.6);
            --accent: #c8d5e0;
            --border: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Повертаємо нормальний курсор, але приховуємо для кастомного, якщо треба */
            cursor: default;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif; /* Основний читабельний шрифт */
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .nav-logo {
            font-family: 'Syne', sans-serif; /* Акцентний шрифт для заголовків */
            text-transform: uppercase;
        }

        /* ── КУРСОР (Нормальний) ── */
        /* Видалено "cursor: none!important". Тепер він працює як треба. 
           Якщо хочеш кастомний, він тепер не перекриває системний "палець" на лінках. */
        a, button { cursor: pointer; }

        /* ── LAYOUT ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ── NAV ── */
        nav {
            position: fixed;
            top: 0; width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            background: rgba(13, 14, 16, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
        .nav-logo em { color: var(--accent); font-style: normal; }

        .nav-links { display: flex; gap: 2rem; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .nav-links a:hover { color: var(--text); }

        /* ── HERO (Виправлення пропорцій) ── */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 5rem);
            line-height: 0.9;
            margin-bottom: 1.5rem;
        }

        .hero-title em { color: var(--accent); font-style: normal; }

        .hero-sub {
            font-size: 1.1rem;
            color: var(--text-dim);
            max-width: 480px;
            margin-bottom: 2rem;
        }

        /* Зображення тепер не приплюснуте */
        .hero-image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 4 / 5; /* Задаємо чітку пропорцію */
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Це рятує від розтягування */
            display: block;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: var(--transition);
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* ── АДАПТИВНІСТЬ ── */
        @media (max-width: 900px) {
            .hero-content { grid-template-columns: 1fr; text-align: center; }
            .hero-sub { margin: 0 auto 2rem; }
            .hero-image-container { display: none; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">MISA<em>.</em></div>
    <div class="nav-links">
        <a href="#">Роботи</a>
        <a href="#">Про мене</a>
        <a href="#">Контакти</a>
    </div>
    <a href="#" class="btn" style="padding: 0.6rem 1.2rem;">Hire Me</a>
</nav>

<section id="hero">
    <div class="container hero-content">
        <div>
            <h1 class="hero-title">Level<br>Designer<br>& <em>3D Artist</em></h1>
            <p class="hero-sub">Створюю атмосферні світи та деталізовані оточення. Спеціалізуюсь на освітленні, композиції та оптимізації ігрових локацій.</p>
            <a href="#projects" class="btn">Переглянути портфоліо</a>
        </div>
        <div class="hero-image-container">
            <!-- Заміни на своє фото/рендер -->
            <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000" alt="Work Preview">
        </div>
    </div>
</section>

</body>
</html>
